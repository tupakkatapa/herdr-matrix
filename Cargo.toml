[package]
name = "herdr-matrix"
version = "0.1.0"
edition = "2024"
description = "A Matrix chat with the herdr agents: takes prompts, files, voice messages and answers, and posts agents that stop or wait while you are away"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
ureq = { version = "3", default-features = false, features = [
  "rustls",
  "platform-verifier",
] }
